name: Deploy frontend to Cloudtype

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Connect deploy key
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: junpyocoin/2026-finance-ai
          stage: main
          yaml: >
            name: finance-ai-challenge-front

            app: next.js

            options:
              nodeversion: "22"
              install: npm install
              build: npm run build
              env:
                - name: NEXT_PUBLIC_API_BASE
                  value: https://port-0-finance-ai-challenge-mt6h85e80eba0f7f.sel3.cloudtype.app
              buildenv: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
